name: Feature request
description: A capability, a source or a change the Metaview plugin should make.
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        A new capability starts in the manifest and needs a handler, tests and a recorded fixture. Read AGENTS.md
        before you open the pull request.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of capability
      options:
        - A read method
        - A Metaview MCP tool class change
        - An events source
        - An account mechanism
        - Documentation or layout
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What a person cannot do today, and why this plugin is the right owner.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: The method or source, its class, the Metaview operations it needs, and what its answer looks like.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk and confirmation
      description: For a write, say what it reaches and how it is confirmed (an ask, or an action grant). For a read, say what it reads.
    validations:
      required: false
